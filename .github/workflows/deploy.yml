name: Deploy to GitHub Pages

on:
  push:
    branches: [source]
  # Fired by the nibli repo (.github/workflows/redeploy-site.yml) on every push to
  # its main, so the build re-pulls the latest nibli crate. See scripts/build_nibli.sh.
  repository_dispatch:
    types: [nibli-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The /nibli artifacts are NOT vendored — they are fetched from the upstream
      # nibli crate and rebuilt on every deploy, so the live demos always track the
      # latest engine: nibli-wasm → the guided /nibli demo, and the nibli-ui Dioxus
      # app → /nibli-playground. See scripts/build_nibli.sh.
      # (The /chat candle runtime under static/play/wasm IS committed, so that is
      # the only other wasm and needs no toolchain here.)
      - name: Add wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          WP_VERSION=v0.15.0
          WP_SHA256=c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
          curl -sL -o wasm-pack.tar.gz "https://github.com/rustwasm/wasm-pack/releases/download/${WP_VERSION}/wasm-pack-${WP_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WP_SHA256}  wasm-pack.tar.gz" | sha256sum -c -
          tar xzf wasm-pack.tar.gz
          install "wasm-pack-${WP_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
          rm -rf wasm-pack.tar.gz "wasm-pack-${WP_VERSION}-x86_64-unknown-linux-musl"
          wasm-pack --version

      - name: Install dx (dioxus-cli)
        run: |
          DX_VERSION=v0.7.9
          DX_SHA256=3b132551b480bc96f938f9f0d37936ee1190f994977539dcc347eaf38540d005
          curl -sL -o dx.tar.gz "https://github.com/DioxusLabs/dioxus/releases/download/${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz"
          echo "${DX_SHA256}  dx.tar.gz" | sha256sum -c -
          tar xzf dx.tar.gz
          install dx /usr/local/bin/dx
          rm -f dx.tar.gz dx
          dx --version

      - name: Build /nibli wasm + /nibli-playground from the nibli crate
        run: bash scripts/build_nibli.sh

      # The /chat candle runtime is committed, so CI needs no further Rust setup.
      - name: Install Zola
        run: |
          ZOLA_VERSION=v0.22.1
          ZOLA_SHA256=0ca09aa40376aaa9ddfb512ff9ad963262ef95edb0d0f2d5ec6961b6f5cf22ef
          curl -sL -o zola.tar.gz "https://github.com/getzola/zola/releases/download/${ZOLA_VERSION}/zola-${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum -c -
          tar xzf zola.tar.gz -C /usr/local/bin
          rm zola.tar.gz
          zola --version

      - name: Build site
        run: zola build

      # Zola can't render an arbitrary templates/llms.txt, so generate it from
      # content front matter into public/ after the build (stdlib python3 only).
      - name: Generate llms.txt
        run: python3 scripts/gen_llms_txt.py

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
