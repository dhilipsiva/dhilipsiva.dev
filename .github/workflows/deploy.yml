name: Deploy to GitHub Pages

on:
  push:
    branches: [source]
  # Fired by the nibli / voksa / silicon-eras / fanva repos
  # (.github/workflows/redeploy-site.yml) on every push to their main, so the build
  # re-pulls the latest crate. See scripts/build_nibli.sh, scripts/build_voksa.sh,
  # scripts/build_silicon_eras.sh, scripts/build_fanva.sh.
  repository_dispatch:
    types: [nibli-updated, voksa-updated, silicon-eras-updated, fanva-updated, lucy-updated]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # The /nibli artifacts are NOT vendored — they are fetched from the upstream
      # nibli crate and rebuilt on every deploy, so the live demos always track the
      # latest engine: nibli-wasm → the guided /nibli demo, and the nibli-ui Dioxus
      # app → /nibli-playground. See scripts/build_nibli.sh.
      # (The /chat candle runtime under static/play/wasm IS committed, so that is
      # the only other wasm and needs no toolchain here.)
      # Use Nibli's verified Rust toolchain. Newer LLVM versions can strip the
      # custom sections required by the upstream locked wasm-bindgen runtime.
      - name: Install the verified Rust and wasm toolchain
        run: |
          rustup toolchain install 1.96.1 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.96.1

      - name: Install wasm-pack
        run: |
          WP_VERSION=v0.15.0
          WP_SHA256=c09f971ecaed9a2efc80fdcea7a00ef6b53c7fadc8c57d1f61b53a6aa66b668a
          curl -sL -o wasm-pack.tar.gz "https://github.com/rustwasm/wasm-pack/releases/download/${WP_VERSION}/wasm-pack-${WP_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          echo "${WP_SHA256}  wasm-pack.tar.gz" | sha256sum -c -
          tar xzf wasm-pack.tar.gz
          install "wasm-pack-${WP_VERSION}-x86_64-unknown-linux-musl/wasm-pack" /usr/local/bin/wasm-pack
          rm -rf wasm-pack.tar.gz "wasm-pack-${WP_VERSION}-x86_64-unknown-linux-musl"
          wasm-pack --version

      - name: Install dx (dioxus-cli)
        run: |
          DX_VERSION=v0.7.9
          DX_SHA256=3b132551b480bc96f938f9f0d37936ee1190f994977539dcc347eaf38540d005
          curl -sL -o dx.tar.gz "https://github.com/DioxusLabs/dioxus/releases/download/${DX_VERSION}/dx-x86_64-unknown-linux-gnu.tar.gz"
          echo "${DX_SHA256}  dx.tar.gz" | sha256sum -c -
          tar xzf dx.tar.gz
          install dx /usr/local/bin/dx
          rm -f dx.tar.gz dx
          dx --version

      # Nibli's lockfile still uses Dioxus 0.7.3. Keep its asset linker separate
      # from the 0.7.9 CLI used by the other applications.
      - name: Install the matching Nibli Dioxus CLI
        run: |
          mkdir -p "$RUNNER_TEMP/nibli-dx"
          curl --fail --location -o "$RUNNER_TEMP/nibli-dx/archive.tar.gz" \
            https://github.com/DioxusLabs/dioxus/releases/download/v0.7.3/dx-x86_64-unknown-linux-gnu.tar.gz
          echo "f274f22d7ed0382d638759cc00b5b7c011457829e83011052ca191c7879f7a0e  $RUNNER_TEMP/nibli-dx/archive.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/nibli-dx/archive.tar.gz" -C "$RUNNER_TEMP/nibli-dx"
          echo "NIBLI_DX=$RUNNER_TEMP/nibli-dx/dx" >> "$GITHUB_ENV"

      - name: Build /nibli wasm + /nibli-playground from the nibli crate
        run: bash scripts/build_nibli.sh

      # /voksa is a Dioxus app (the voksa tuning console) fetched from the voksa
      # crate and built with the same dx already installed above — no wasm-pack
      # or extra toolchain needed. See scripts/build_voksa.sh.
      - name: Build /voksa console from the voksa crate
        run: bash scripts/build_voksa.sh

      # /silicon-eras is a Dioxus app (the hardware-history explorable) fetched from
      # the silicon-eras crate and built with the same dx installed above; its dataset
      # is embedded at build time by app/build.rs. See scripts/build_silicon_eras.sh.
      - name: Build /silicon-eras from the silicon-eras crate
        run: bash scripts/build_silicon_eras.sh

      # /fanva is a Dioxus app (the English→Lojban translator playground) fetched from
      # the fanva crate and built with the same dx above; the build fetches the lensisku
      # dictionary first (a compile-time input read by smuni-dictionary). The gerna/smuni/
      # camxes gates run in-browser — no fanva server. See scripts/build_fanva.sh.
      - name: Build /fanva translator from the fanva crate
        run: bash scripts/build_fanva.sh

      - name: Install uv for the Book 1 assembler
        uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6

      # Tracks upstream main, with its engine.pin and a private matching bindgen.
      # The generated edge proposals remain outside the single Pages artifact.
      - name: Build /rights-nobody-has-to-earn from Book 1
        run: bash scripts/build_rights_book.sh

      # The /chat candle runtime is committed, so CI needs no further Rust setup.
      - name: Install Zola
        run: |
          ZOLA_VERSION=v0.22.1
          ZOLA_SHA256=0ca09aa40376aaa9ddfb512ff9ad963262ef95edb0d0f2d5ec6961b6f5cf22ef
          curl -sL -o zola.tar.gz "https://github.com/getzola/zola/releases/download/${ZOLA_VERSION}/zola-${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZOLA_SHA256}  zola.tar.gz" | sha256sum -c -
          tar xzf zola.tar.gz -C /usr/local/bin
          rm zola.tar.gz
          zola --version

      - name: Build site
        run: zola build

      # Zola can't render an arbitrary templates/llms.txt, so generate it from
      # content front matter into public/ after the build (stdlib python3 only).
      - name: Host Lucy's rooms from the lucy repository, the Rust one at /lucy/room and the earlier one at /lucy/nell
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/dhilipsiva/lucy.git /tmp/lucy-origin
          (cd /tmp/lucy-origin && node nell/test/standing.mjs && node nell/test/memory.mjs && node nell/test/journal.mjs && node nell/test/senses.mjs)
          (cd /tmp/lucy-origin/room && wasm-pack build --release --target web --out-dir pkg --out-name lucy_room)
          mkdir -p public/lucy/nell public/lucy/lucy public/lucy/room/pkg
          cp -r /tmp/lucy-origin/nell/. public/lucy/nell/
          rm -rf public/lucy/nell/test
          cp /tmp/lucy-origin/room/index.html /tmp/lucy-origin/room/styles.css public/lucy/room/
          cp -r /tmp/lucy-origin/room/tokens /tmp/lucy-origin/room/assets public/lucy/room/
          cp /tmp/lucy-origin/room/pkg/lucy_room.js /tmp/lucy-origin/room/pkg/lucy_room_bg.wasm public/lucy/room/pkg/
          cp /tmp/lucy-origin/lucy/constitution.nibli /tmp/lucy-origin/lucy/memory.nibli public/lucy/lucy/
          echo "Lucy's rooms at /lucy/room and /lucy/nell from $(git -C /tmp/lucy-origin rev-parse --short HEAD)"
      - name: Generate llms.txt
        run: python3 scripts/gen_llms_txt.py

      # The Dioxus-built apps can't extend base.html; graft the rendered navbar
      # onto the app pages, plus the shared footer on all Book 1 SSR documents.
      # Book hydration trees and source content are preserved (stdlib only).
      - name: Inject shared site navigation into Dioxus apps
        run: python3 scripts/inject_nav.py

      - name: Check the Book 1 mount and local hosting contract
        run: |
          python3 scripts/rights_book.py check static/rights-nobody-has-to-earn --compare public/rights-nobody-has-to-earn
          python3 -m unittest discover -s tests -p 'test_rights_book.py'

      - name: Check Lucy discovery pages
        run: python3 -m unittest discover -s tests -p 'test_lucy.py'

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
