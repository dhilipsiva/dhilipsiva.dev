# dhilipsiva.dev — Zola config
# Visuals come from the QUINE Design System (static/assets/quine.css, lifted verbatim).
# (dhilipsiva.com is NOT ours anymore — lost to a squatter after ~20 years; never link to it.)
base_url = "https://dhilipsiva.dev"
title = "dhilipsiva"
description = "Software architect and open-source builder — Rust, Python, distributed systems, WebAssembly, symbolic reasoning."
default_language = "en"

compile_sass = false
build_search_index = false
generate_feeds = true
feed_filenames = ["rss.xml"]

# Drop /musings/page/1/ and /page/2/ (pagination duplicates of /musings/) from the
# sitemap. They already canonicalize to /musings/; this just stops listing them.
exclude_paginated_pages_in_sitemap = "all"

taxonomies = [
  { name = "tags", feed = true },
]

[markdown]
smart_punctuation = false
# Auto-highlighting left OFF (Zola default). QUINE styles <pre> monochrome on the void,
# and designed code blocks use hand-authored .c-* spans. To enable color later, add:
#   [markdown.highlighting]
#   enabled = true
#   theme = "ayu-dark"   # a bundled dark theme

[extra]
author = "dhilipsiva"
email = "dhilipsiva@pm.me"
location = "Bangalore, India"
avatar = "/assets/avatar.jpg"  # headshot — feeds Person/JSON-LD image + the /about portrait
tagline = "An optimistic nihilist, hands-on architect and lifelong builder who loves Science, Rust, Python, FOSS, WebAssembly, WebRTC, web3, distributed systems, and symbolic reasoning."
footer_tag = "Build systems that outlive their meaning. One must imagine the compiler happy."

# Social links — used by the social row (footer / home / contact)
github = "https://github.com/dhilipsiva"
linkedin = "https://www.linkedin.com/in/dhilipsiva/"
stackoverflow = "https://stackoverflow.com/users/1235072/dhilipsiva"
medium = "https://medium.com/@dhilipsiva"
devto = "https://dev.to/dhilipsiva"
twitter = "https://twitter.com/dhilipsiva"
