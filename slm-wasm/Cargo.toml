[package]
name = "slm-wasm"
version = "0.1.0"
edition = "2021"
description = "In-browser SLM inference for dhilipsiva.dev — candle (Rust) compiled to WebAssembly"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candle = { version = "0.11.1", package = "candle-core" }
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
tokenizers = { version = "0.22", default-features = false, features = ["unstable_wasm"] }
serde_json = "1"
anyhow = "1"
num-traits = "0.2"
wasm-bindgen = "0.2"
js-sys = "0.3"
console_error_panic_hook = "0.1.7"
getrandom = { version = "0.3", features = ["wasm_js"] }
# Spans in src/quantized_qwen3.rs (vendored from candle-transformers 0.10.2).
tracing = "0.1"

[profile.release]
lto = true
opt-level = 3

# wasm-opt occasionally hangs on Windows; the -O3 rustc output is already fine for our use.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
